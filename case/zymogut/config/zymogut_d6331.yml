  # Fungi (2 strains)
  - species: "Saccharomyces cerevisiae"
    taxid: 4932
    genomic_dna_pct: 6.09
    domain: "Eukaryota"

  - species: "Candida albicans"
    taxid: 5476
    genomic_dna_pct: 5.59
    domain: "Eukaryota"

# Assembly parameters
assembly:
  tool: "flye"
  version: ">=2.9"
  mode: "--nano-hq"  # SUP basecalls are high quality
  extra_args: "--meta"
  min_threads: 8
  recommended_threads: 16

# HYMET classification parameters
classification:
  mode: "contigs"
  threads: 8
  cand_max: 5000  # default

# Output paths (relative to workflow root)
outputs:
  work_dir: "work"
  assembly_dir: "work/assembly"
  truth_dir: "work/truth"
  hymet_dir: "work/hymet_output"
  results_dir: "results"
  figures_dir: "results/figures"
